<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Router Paneli</title>
<style>
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --surface-2: #eef1f6;
    --ink: #161b26;
    --ink-2: #4a5468;
    --ink-3: #7a8499;
    --line: #e1e6ee;
    --focus: #3d6bdc;
    --haiku: #1fa37a;
    --sonnet: #3d6bdc;
    --opus: #d9822b;
    --fable: #8a4fd6;
    --inherit: #8a93a6;
    --ok: #1fa37a;
    --err: #d64545;
    --radius: 12px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f131b;
      --surface: #171c27;
      --surface-2: #1f2633;
      --ink: #e8ecf4;
      --ink-2: #aab3c5;
      --ink-3: #7c869b;
      --line: #273044;
      --focus: #7b9bf0;
      --haiku: #34c796;
      --sonnet: #6c92f2;
      --opus: #f0a04d;
      --fable: #b283f0;
      --inherit: #7c869b;
      --ok: #34c796;
      --err: #f07070;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

  .app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }

  /* Sol sütun */
  aside {
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 22px 14px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-weight: 650; font-size: 16px; letter-spacing: -0.01em; }
  .brand .tiers { height: 18px; }
  .projects { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; margin: 0 -4px; padding: 0 4px; }
  .project {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline;
    text-align: left; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: none; cursor: pointer;
  }
  .project:hover { background: var(--surface-2); }
  .project[aria-current="true"] { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--ink); }
  .project .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project .count { color: var(--ink-2); font-weight: 600; }
  .project .when { grid-column: 1 / -1; color: var(--ink-3); font-size: 13px; }
  .side-foot { padding: 0 8px; }

  .btn {
    border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--line)); }
  .confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14px; }

  /* Ana alan */
  main { padding: 34px clamp(18px, 4vw, 48px) 64px; max-width: 1040px; width: 100%; }
  .head h1 { margin: 0; font-size: clamp(26px, 3.4vw, 36px); line-height: 1.15; letter-spacing: -0.02em; font-weight: 700; overflow-wrap: anywhere; }
  .head p { margin: 6px 0 0; color: var(--ink-2); }

  /* Model payı: hem özet hem filtre */
  .mix { margin: 26px 0 8px; }
  .mixbar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface-2); gap: 2px; }
  .mixbar .seg { height: 100%; min-width: 4px; transition: flex-grow .35s ease; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip {
    display: inline-flex; align-items: center; gap: 9px; padding: 7px 12px 7px 10px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
  }
  .chip:hover { background: var(--surface-2); }
  .chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .chip .n { font-weight: 700; }
  .chip .pct { color: var(--ink-3); font-size: 13px; }
  .hint { color: var(--ink-3); font-size: 13px; margin: 10px 0 0; }

  /* Seviye çubukları: Haiku 1, Sonnet 2, Opus 3, Fable 4 */
  .tiers { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; }
  .tiers i { display: block; width: 4px; border-radius: 1.5px; background: var(--line); }
  .tiers i:nth-child(1) { height: 25%; } .tiers i:nth-child(2) { height: 50%; }
  .tiers i:nth-child(3) { height: 75%; } .tiers i:nth-child(4) { height: 100%; }
  .tiers.haiku i:nth-child(-n+1), .tiers.sonnet i:nth-child(-n+2), .tiers.opus i:nth-child(-n+3), .tiers.fable i:nth-child(-n+4) { background: var(--c); }
  .haiku { --c: var(--haiku); } .sonnet { --c: var(--sonnet); } .opus { --c: var(--opus); } .fable { --c: var(--fable); } .inherit { --c: var(--inherit); }
  .tiers.inherit i { background: var(--line); }
  .brand .tiers i { background: var(--ink); }
  .brand .tiers i:nth-child(1) { background: var(--haiku); } .brand .tiers i:nth-child(2) { background: var(--sonnet); }
  .brand .tiers i:nth-child(3) { background: var(--opus); } .brand .tiers i:nth-child(4) { background: var(--fable); }

  /* Kayıt listesi */
  .day { margin: 30px 0 8px; font-size: 14px; font-weight: 650; color: var(--ink-2); }
  .log { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .row {
    display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 6px 18px; align-items: start;
    padding: 14px 18px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; cursor: pointer;
  }
  .log .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--surface-2); }
  .model { display: inline-flex; align-items: center; gap: 9px; font-weight: 650; color: var(--c); padding-top: 1px; }
  .model .tiers { height: 14px; }
  .body .sum { margin: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row[aria-expanded="true"] .sum { -webkit-line-clamp: unset; display: block; }
  .body .why { margin: 3px 0 0; color: var(--ink-3); font-size: 13.5px; overflow-wrap: anywhere; }
  .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; }
  .meta .top { display: inline-flex; align-items: center; gap: 8px; }
  .tag { color: var(--ink-2); background: var(--surface-2); border-radius: 6px; padding: 1px 7px; font-size: 12.5px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--inherit); display: inline-block; }
  .dot.done { background: var(--ok); } .dot.error { background: var(--err); } .dot.background { background: var(--sonnet); }
  .dot.running { background: var(--opus); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--opus) 55%, transparent); } 50% { box-shadow: 0 0 0 6px transparent; } }
  .time { color: var(--ink-3); }

  .empty { margin-top: 12vh; max-width: 420px; color: var(--ink-2); }
  .empty h2 { margin: 0 0 8px; color: var(--ink); font-size: 20px; letter-spacing: -0.01em; }
  .empty p { margin: 0; }

  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    main { min-width: 0; }
    aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 14px; }
    .projects { flex-direction: row; overflow-x: auto; overflow-y: visible; flex: none; padding-bottom: 4px; }
    .project { width: auto; min-width: 150px; flex: none; border: 1px solid var(--line); }
    .project .when { display: none; }
    .row { grid-template-columns: minmax(0, 1fr); padding: 14px; }
    .meta { flex-direction: row; align-items: center; justify-content: space-between; white-space: normal; flex-wrap: wrap; gap: 4px 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot.running { animation: none; }
    .mixbar .seg { transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="tiers" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Model Router</div>
    <nav class="projects" id="projects" aria-label="Projeler"></nav>
    <div class="side-foot" id="foot"></div>
  </aside>
  <main id="main"></main>
</div>
<script>
  var MODELS = ['haiku', 'sonnet', 'opus', 'fable'];
  var LABEL = { haiku: 'Haiku', sonnet: 'Sonnet', opus: 'Opus', fable: 'Fable', inherit: 'Ana model' };
  var STATUS = { running: 'çalışıyor', done: 'bitti', error: 'hata', background: 'arka planda' };

  var state = { project: null, filter: null, open: {}, confirming: false, projects: [], events: [] };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function modelKey(m) {
    m = String(m || 'inherit').toLowerCase();
    return MODELS.indexOf(m) >= 0 ? m : 'inherit';
  }
  function tiers(key) {
    var t = el('span', 'tiers ' + key);
    t.setAttribute('aria-hidden', 'true');
    for (var i = 0; i < 4; i++) t.appendChild(el('i'));
    return t;
  }
  function ago(ts) {
    var s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 60) return 'şimdi';
    if (s < 3600) return Math.floor(s / 60) + ' dk önce';
    if (s < 86400) return Math.floor(s / 3600) + ' sa önce';
    return Math.floor(s / 86400) + ' gün önce';
  }
  function clock(ts) {
    return new Date(ts).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  }
  function dayLabel(ts) {
    var d = new Date(ts), n = new Date();
    var start = function (x) { return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); };
    var diff = Math.round((start(n) - start(d)) / 86400000);
    if (diff === 0) return 'Bugün';
    if (diff === 1) return 'Dün';
    return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  function dur(ms) {
    if (ms === undefined || ms === null) return '';
    return ms < 1000 ? ms + ' ms' : ms < 60000 ? (ms / 1000).toFixed(1) + ' sn' : Math.floor(ms / 60000) + ' dk ' + Math.round((ms % 60000) / 1000) + ' sn';
  }
  function getJSON(url) { return fetch(url, { cache: 'no-store' }).then(function (r) { return r.json(); }); }

  function renderProjects() {
    var nav = document.getElementById('projects');
    nav.textContent = '';
    state.projects.forEach(function (p) {
      var b = el('button', 'project');
      b.setAttribute('aria-current', String(p.project === state.project));
      b.appendChild(el('span', 'name', p.project));
      b.appendChild(el('span', 'count', String(p.count)));
      b.appendChild(el('span', 'when', ago(p.last)));
      b.onclick = function () { state.project = p.project; state.filter = null; refresh(); };
      nav.appendChild(b);
    });
  }

  function renderFoot() {
    var foot = document.getElementById('foot');
    foot.textContent = '';
    if (!state.projects.length) return;
    if (!state.confirming) {
      var b = el('button', 'btn danger', 'Kayıtları temizle');
      b.onclick = function () { state.confirming = true; renderFoot(); };
      foot.appendChild(b);
      return;
    }
    var box = el('div', 'confirm');
    box.appendChild(el('span', '', 'Tüm projelerin kayıtları silinecek.'));
    var yes = el('button', 'btn danger', 'Sil');
    yes.onclick = function () {
      fetch('/api/clear', { method: 'POST' }).then(function () {
        state.confirming = false; state.project = null; state.filter = null; refresh();
      });
    };
    var no = el('button', 'btn', 'Vazgeç');
    no.onclick = function () { state.confirming = false; renderFoot(); };
    box.appendChild(yes);
    box.appendChild(no);
    foot.appendChild(box);
  }

  function renderMix(head, events) {
    var counts = {};
    events.forEach(function (e) { var k = modelKey(e.model); counts[k] = (counts[k] || 0) + 1; });
    var keys = MODELS.concat(['inherit']).filter(function (k) { return counts[k]; });

    var mix = el('section', 'mix');
    mix.setAttribute('aria-label', 'Model payı');
    var bar = el('div', 'mixbar');
    keys.forEach(function (k) {
      var seg = el('div', 'seg ' + k);
      seg.style.background = 'var(--c)';
      seg.style.flexGrow = String(counts[k]);
      seg.style.opacity = state.filter && state.filter !== k ? '0.25' : '1';
      bar.appendChild(seg);
    });
    mix.appendChild(bar);

    var legend = el('div', 'legend');
    keys.forEach(function (k) {
      var chip = el('button', 'chip ' + k);
      chip.setAttribute('aria-pressed', String(state.filter === k));
      chip.appendChild(tiers(k));
      chip.appendChild(el('span', '', LABEL[k]));
      chip.appendChild(el('span', 'n', String(counts[k])));
      chip.appendChild(el('span', 'pct', Math.round((counts[k] / events.length) * 100) + '%'));
      chip.onclick = function () { state.filter = state.filter === k ? null : k; renderMain(); };
      legend.appendChild(chip);
    });
    mix.appendChild(legend);
    head.appendChild(mix);
  }

  function renderRow(e) {
    var key = modelKey(e.model);
    var row = el('button', 'row ' + key);
    row.setAttribute('aria-expanded', String(!!state.open[e.id]));
    row.onclick = function () { state.open[e.id] = !state.open[e.id]; renderMain(); };

    var model = el('span', 'model');
    model.appendChild(tiers(key));
    model.appendChild(document.createTextNode(LABEL[key]));
    row.appendChild(model);

    var body = el('div', 'body');
    body.appendChild(el('p', 'sum', e.summary || 'İstek metni kaydedilmedi'));
    if (e.reason) body.appendChild(el('p', 'why', e.reason));
    row.appendChild(body);

    var meta = el('div', 'meta');
    var top = el('span', 'top');
    if (e.source === 'override') top.appendChild(el('span', 'tag', '@etiket'));
    var st = el('span', 'status');
    st.appendChild(el('span', 'dot ' + e.status));
    st.appendChild(document.createTextNode(' ' + (STATUS[e.status] || e.status)));
    top.appendChild(st);
    meta.appendChild(top);
    var d = dur(e.durationMs);
    meta.appendChild(el('span', 'time', clock(e.ts) + (d ? ', ' + d : '')));
    row.appendChild(meta);
    return row;
  }

  function renderMain() {
    var main = document.getElementById('main');
    main.textContent = '';
    if (!state.projects.length) {
      var empty = el('div', 'empty');
      empty.appendChild(el('h2', '', 'Henüz yönlendirme yok'));
      empty.appendChild(el('p', '', 'Claude Code’da bir kodlama isteği ver. İsteğin hangi modele gittiği burada görünecek.'));
      main.appendChild(empty);
      return;
    }
    var all = state.events;
    var head = el('div', 'head');
    head.appendChild(el('h1', '', state.project || ''));
    var last = all[0];
    head.appendChild(el('p', '', all.length + ' yönlendirme' + (last ? ', en son ' + ago(last.ts) : '')));
    main.appendChild(head);
    renderMix(main, all);
    if (all.length) main.appendChild(el('p', 'hint', 'Bir modele tıklayarak listeyi süzebilirsin. Ayrıntı için satıra tıkla.'));

    var shown = state.filter ? all.filter(function (e) { return modelKey(e.model) === state.filter; }) : all;
    var lastDay = null, log = null;
    shown.forEach(function (e) {
      var day = dayLabel(e.ts);
      if (day !== lastDay) {
        main.appendChild(el('h2', 'day', day));
        log = el('div', 'log');
        main.appendChild(log);
        lastDay = day;
      }
      log.appendChild(renderRow(e));
    });
  }

  function refresh() {
    getJSON('/api/projects').then(function (list) {
      state.projects = list;
      if (!list.length) { state.project = null; state.events = []; renderProjects(); renderFoot(); renderMain(); return; }
      if (!state.project || !list.some(function (p) { return p.project === state.project; })) state.project = list[0].project;
      return getJSON('/api/events?project=' + encodeURIComponent(state.project)).then(function (events) {
        state.events = events;
        renderProjects(); renderFoot(); renderMain();
      });
    }).catch(function () {});
  }

  refresh();
  setInterval(function () { if (!document.hidden) refresh(); }, 3000);
</script>
</body>
</html>
